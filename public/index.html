<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1xly Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative pb-12">
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <div class="max-w-6xl mx-auto p-6">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl">
            <div>
                <h1 id="app-header-title" class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">P1XLY SYSTEM</h1>
                <p class="text-xs text-slate-400 mt-1">Панель управления сервисами и автоматизацией</p>
            </div>
            <div id="stats-box" class="flex flex-wrap gap-3 text-xs font-medium">
                <div class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-2xl">🤖 Ботов: <span id="stat-bots" class="text-indigo-400 font-bold">0</span></div>
                <div class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-2xl">🟢 Аккаунтов: <span id="stat-accs" class="text-emerald-400 font-bold">0</span></div>
                <div class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-2xl">🚨 Скамеров: <span id="stat-scam" class="text-red-400 font-bold">0</span></div>
            </div>
        </header>

        <!-- Меню вкладок -->
        <nav id="nav-tabs" class="flex flex-wrap gap-3 mb-8 border-b border-slate-800 pb-4"></nav>

        <main id="main-content"></main>
    </div>

    <script>
        let appData = {};
        let currentUserId = localStorage.getItem('p1xly_user_id') || 'user_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('p1xly_user_id', currentUserId);
        let activeTab = 'catalog';
        let pendingSessionId = '';

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-5 py-3 rounded-2xl border text-sm font-medium shadow-2xl transition transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-950/90 border-emerald-800 text-emerald-300' : 'bg-red-950/90 border-red-800 text-red-300'}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function loadData() {
            try {
                const res = await fetch('/api/data');
                appData = await res.json();
                
                if (appData.settings && appData.settings.app_title) {
                    document.getElementById('app-header-title').innerText = appData.settings.app_title;
                }
                
                updateStats();
                renderNav();
                renderActiveTab();
            } catch (e) {
                console.error(e);
            }
        }

        function updateStats() {
            if (!appData.stats) return;
            document.getElementById('stat-bots').innerText = appData.stats.botsCount;
            document.getElementById('stat-accs').innerText = appData.stats.accountsCount;
            document.getElementById('stat-scam').innerText = appData.stats.scammersCount;
        }

        function renderNav() {
            const nav = document.getElementById('nav-tabs');
            nav.innerHTML = '';
            
            // Жесткий фоллбек, если бэк не отдал вкладки
            const defaultTabs = [
                { id: 'catalog', name: 'Каталог' },
                { id: 'sender', name: 'Отправка (MTProto)' },
                { id: 'scammers', name: 'База скамеров' },
                { id: 'faq', name: 'Инструкция' },
                { id: 'owner', name: 'О владельце' },
                { id: 'sub', name: 'Подписка' }
            ];

            const tabsToRender = (appData.tabs && appData.tabs.length > 0) ? appData.tabs : defaultTabs;

            tabsToRender.forEach(tab => {
                if (tab.is_enabled == 0 && !localStorage.getItem('isAdmin')) return;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-xl font-medium transition ${activeTab === tab.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'}`;
                btn.innerText = tab.name;
                btn.onclick = () => { activeTab = tab.id; renderActiveTab(); };
                nav.appendChild(btn);
            });

            const adminBtn = document.createElement('button');
            adminBtn.className = `px-4 py-2 rounded-xl font-medium transition bg-slate-900 text-red-400 border border-red-900/50 hover:bg-red-950/30 ml-auto`;
            adminBtn.innerText = '⚙️ Админка';
            adminBtn.onclick = () => { activeTab = 'admin'; renderActiveTab(); };
            nav.appendChild(adminBtn);
        }

        async function renderActiveTab() {
            renderNav();
            const main = document.getElementById('main-content');
            
            if (activeTab === 'catalog') {
                main.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">Каталог модулей и ботов</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${(appData.bots || []).map(b => `
                            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between">
                                <div>
                                    <span class="text-xs px-2.5 py-1 bg-indigo-500/10 text-indigo-400 rounded-lg">${(b.category || '').toUpperCase()}</span>
                                    <h3 class="text-lg font-bold mt-3">${b.title}</h3>
                                    <p class="text-sm text-slate-400 mt-1">${b.description}</p>
                                </div>
                                <a href="${b.link}" target="_blank" class="mt-6 block text-center bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl font-medium transition">Открыть</a>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (activeTab === 'sender') {
                const subCheck = await fetch('/api/check-sub', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: currentUserId })
                }).then(r => r.json());

                if (!subCheck.active) {
                    main.innerHTML = `
                        <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center">
                            <h2 class="text-2xl font-bold text-red-400 mb-2">🔒 Доступ заблокирован</h2>
                            <p class="text-slate-400 text-sm mb-6">Для отправки сообщений через мульти-аккаунты требуется подписка.</p>
                            <button onclick="activeTab='sub'; renderActiveTab();" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition">Активировать промокод</button>
                        </div>
                    `;
                    return;
                }

                main.innerHTML = `
                    <div class="max-w-xl mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl">
                        <h2 class="text-xl font-bold mb-6">🤖 Мульти-аккаунт отправка</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs text-slate-400 block mb-1">Живой аккаунт:</label>
                                <select id="accId" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    ${(subCheck.accounts || []).map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 block mb-1">Получатель (@username):</label>
                                <input type="text" id="recipient" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl" placeholder="@username">
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 block mb-1">Текст сообщения:</label>
                                <textarea id="msgText" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl" placeholder="Текст сообщения..."></textarea>
                            </div>
                            <button onclick="sendMessage()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold transition">Отправить</button>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'scammers') {
                main.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6 text-red-400">🚨 Черный список (Скамеры)</h2>
                    <div class="space-y-3">
                        ${(appData.scammers || []).map(s => `
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                <div>
                                    <span class="font-bold text-red-400 text-lg">${s.username}</span>
                                    <p class="text-sm text-slate-400 mt-1"><b>Причина:</b> ${s.reason}</p>
                                </div>
                                ${s.proof ? `<a href="${s.proof}" target="_blank" class="text-xs bg-red-950 text-red-400 border border-red-900/50 hover:bg-red-900 px-4 py-2.5 rounded-xl font-medium">Смотреть пруфы</a>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (activeTab === 'faq') {
                main.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">📖 Инструкция и FAQ</h2>
                    <div class="space-y-4">
                        ${(appData.faq || []).map(f => `
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                                <h3 class="font-bold text-indigo-400 text-base">${f.question}</h3>
                                <p class="text-sm text-slate-300 mt-2 leading-relaxed">${f.answer}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (activeTab === 'owner') {
                main.innerHTML = `
                    <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center">
                        <h2 class="text-xl font-bold mb-4">👤 О владельце</h2>
                        <p class="text-slate-300 whitespace-pre-wrap">${appData.settings?.bio || 'Информация не указана'}</p>
                    </div>
                `;
            } else if (activeTab === 'sub') {
                main.innerHTML = `
                    <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl">
                        <h2 class="text-xl font-bold mb-4 text-center">🎁 Активация подписки</h2>
                        <input type="text" id="promoCode" placeholder="Введите промокод" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl mb-4 text-center">
                        <button onclick="activatePromo()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition">Активировать</button>
                    </div>
                `;
            } else if (activeTab === 'admin') {
                const isAdmin = await fetch('/api/check-auth').then(r => r.json());
                if (!isAdmin.isAdmin) {
                    main.innerHTML = `
                        <div class="max-w-sm mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center">
                            <h2 class="text-xl font-bold mb-4">Вход в админку</h2>
                            <input type="password" id="adminPass" placeholder="Пароль администратора" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl mb-4 text-center">
                            <button onclick="loginAdmin()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition">Войти</button>
                        </div>
                    `;
                } else {
                    main.innerHTML = `
                        <div class="space-y-8">
                            <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h2 class="text-xl font-bold">⚡ Панель полного контроля</h2>
                                <button onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-xl text-sm font-medium">Выйти</button>
                            </div>
                            
                            <!-- Настройки -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h3 class="text-lg font-bold mb-4">⚙️ Настройки сайта и текстов</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                                    <input type="text" id="cfgAppTitle" value="${appData.settings?.app_title || ''}" placeholder="Название в шапке" class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <input type="text" id="cfgLncTitle" value="${appData.settings?.launcher_title || ''}" placeholder="Заголовок лаунчера" class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                </div>
                                <textarea id="cfgBio" placeholder="Био владельца" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl mb-3">${appData.settings?.bio || ''}</textarea>
                                <button onclick="saveSettings()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2.5 rounded-xl font-bold">Сохранить настройки</button>
                            </div>

                            <!-- Управление вкладками -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h3 class="text-lg font-bold mb-4">📁 Управление вкладками</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${(appData.tabs || []).map(t => `
                                        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                                            <div class="text-xs text-indigo-400 font-bold">ID: ${t.id}</div>
                                            <input type="text" id="tName_${t.id}" value="${t.name}" class="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-sm">
                                            <select id="tEn_${t.id}" class="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-sm">
                                                <option value="1" ${t.is_enabled ? 'selected' : ''}>Включена</option>
                                                <option value="0" ${!t.is_enabled ? 'selected' : ''}>Выключена</option>
                                            </select>
                                            <button onclick="saveTab('${t.id}')" class="w-full bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-xs font-medium">Обновить</button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Промокоды -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h3 class="text-lg font-bold mb-4">🎁 Управление промокодами</h3>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                                    <input type="text" id="pCode" placeholder="Код (например: BRO)" class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <input type="number" id="pDays" placeholder="Дней подписки" class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <input type="number" id="pUses" placeholder="Лимит активаций" class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                </div>
                                <button onclick="createPromo()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2.5 rounded-xl font-bold mb-6">Создать промокод</button>
                                <div class="space-y-2">
                                    ${(appData.promocodes || []).map(p => `
                                        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 text-sm">
                                            <span><b>${p.code}</b> (+${p.days} дн., лимит: ${p.uses_left})</span>
                                            <button onclick="deletePromo(${p.id})" class="text-xs bg-red-950 text-red-400 px-3 py-1.5 rounded-lg">Удалить</button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Аккаунты -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h3 class="text-lg font-bold mb-4">🟢 MTProto Аккаунты</h3>
                                <div class="space-y-3 mb-6">
                                    ${(appData.accounts || []).map(a => `
                                        <div class="flex justify-between items-center bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <div>
                                                <span class="font-bold ${a.is_alive ? 'text-emerald-400' : 'text-red-400'}">${a.name}</span>
                                                <span class="text-xs ml-2 text-slate-500">(${a.is_alive ? 'Активен' : 'Мертв'})</span>
                                            </div>
                                            <div class="space-x-2">
                                                <button onclick="toggleAcc(${a.id})" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg">Статус</button>
                                                <button onclick="deleteAcc(${a.id})" class="text-xs bg-red-950 text-red-400 hover:bg-red-900 px-3 py-2 rounded-lg">Удалить</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                                <h4 class="text-sm font-bold mb-2 text-slate-400">Авторизовать новый аккаунт</h4>
                                <div id="tgStep1" class="space-y-3">
                                    <input type="text" id="tgPhone" placeholder="Номер телефона (+998...)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <button onclick="tgSendCode()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl font-medium">Запросить код</button>
                                </div>
                                <div id="tgStep2" class="space-y-3 hidden mt-4">
                                    <input type="text" id="tgCode" placeholder="Код из Telegram" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <input type="password" id="tgPassword" placeholder="Облачный пароль 2FA" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <button onclick="tgVerifyCode()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl font-medium">Подтвердить</button>
                                </div>
                                <p id="tgRes" class="text-sm mt-3"></p>
                            </div>

                            <!-- FAQ -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h3 class="text-lg font-bold mb-4">📖 Управление FAQ</h3>
                                <div class="space-y-3 mb-6">
                                    <input type="text" id="faqQ" placeholder="Вопрос" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <textarea id="faqA" placeholder="Ответ" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl"></textarea>
                                    <button onclick="addFaq()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2.5 rounded-xl font-bold">Добавить вопрос</button>
                                </div>
                                <div class="space-y-2">
                                    ${(appData.faq || []).map(f => `
                                        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 text-sm">
                                            <span><b>${f.question}</b></span>
                                            <button onclick="deleteFaq(${f.id})" class="text-xs bg-red-950 text-red-400 px-3 py-1.5 rounded-lg">Удалить</button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Боты и Скамеры -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                    <h3 class="text-lg font-bold mb-4">🤖 Каталог Ботов</h3>
                                    <div class="space-y-3 mb-4">
                                        <input type="text" id="botTitle" placeholder="Название" class="bg-slate-950 border border-slate-800 p-3 rounded-xl w-full">
                                        <input type="text" id="botCategory" placeholder="Категория" class="bg-slate-950 border border-slate-800 p-3 rounded-xl w-full">
                                        <input type="text" id="botDesc" placeholder="Описание" class="bg-slate-950 border border-slate-800 p-3 rounded-xl w-full">
                                        <input type="text" id="botLink" placeholder="Ссылка" class="bg-slate-950 border border-slate-800 p-3 rounded-xl w-full">
                                        <button onclick="addBot()" class="bg-indigo-600 hover:bg-indigo-500 w-full py-2.5 rounded-xl font-bold">Добавить бота</button>
                                    </div>
                                    <div class="space-y-2 max-h-40 overflow-y-auto">
                                        ${(appData.bots || []).map(b => `
                                            <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs">
                                                <span>${b.title}</span>
                                                <button onclick="deleteBot(${b.id})" class="bg-red-950 text-red-400 px-2 py-1 rounded">Удалить</button>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                    <h3 class="text-lg font-bold mb-4 text-red-400">🚨 База Скамеров</h3>
                                    <div class="space-y-3 mb-4">
                                        <input type="text" id="scamUser" placeholder="@username" class="bg-slate-950 border border-slate-800 p-3 rounded-xl w-full">
                                        <input type="text" id="scamReason" placeholder="Причина" class="bg-slate-950 border border-slate-800 p-3 rounded-xl w-full">
                                        <input type="text" id="scamProof" placeholder="Пруфы (ссылка)" class="bg-slate-950 border border-slate-800 p-3 rounded-xl w-full">
                                        <button onclick="addScammer()" class="bg-red-600 hover:bg-red-500 w-full py-2.5 rounded-xl font-bold">Внести скамера</button>
                                    </div>
                                    <div class="space-y-2 max-h-40 overflow-y-auto">
                                        ${(appData.scammers || []).map(sc => `
                                            <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs">
                                                <span>${sc.username}</span>
                                                <button onclick="deleteScammer(${sc.id})" class="bg-red-950 text-red-400 px-2 py-1 rounded">Удалить</button>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>

                            <!-- Логи -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h3 class="text-lg font-bold mb-4">📊 Логи активности (Последние 50)</h3>
                                <div class="space-y-2 max-h-60 overflow-y-auto">
                                    ${(appData.logs || []).map(l => `
                                        <div class="text-xs bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between">
                                            <span><b>${l.user_id}</b>: ${l.action} (${l.ip})</span>
                                            <span class="text-slate-500">${new Date(l.timestamp).toLocaleTimeString()}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        async function sendMessage() {
            const res = await fetch('/api/tg/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    userId: currentUserId,
                    accountId: document.getElementById('accId').value,
                    recipient: document.getElementById('recipient').value,
                    message: document.getElementById('msgText').value
                })
            }).then(r => r.json());
            showToast(res.message, res.success ? 'success' : 'error');
        }

        async function activatePromo() {
            const res = await fetch('/api/activate-promo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: currentUserId, code: document.getElementById('promoCode').value })
            }).then(r => r.json());
            showToast(res.message, res.success ? 'success' : 'error');
        }

        async function loginAdmin() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password: document.getElementById('adminPass').value })
            }).then(r => r.json());
            if (res.success) { showToast('Успешный вход!'); loadData(); }
            else showToast('Неверный пароль', 'error');
        }

        async function logoutAdmin() {
            await fetch('/api/logout', { method: 'POST' });
            loadData();
            showToast('Выход выполнен');
        }

        async function saveSettings() {
            await fetch('/api/admin/settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ key: 'app_title', value: document.getElementById('cfgAppTitle').value }) });
            await fetch('/api/admin/settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ key: 'launcher_title', value: document.getElementById('cfgLncTitle').value }) });
            await fetch('/api/admin/settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ key: 'bio', value: document.getElementById('cfgBio').value }) });
            loadData();
            showToast('Настройки сохранены!');
        }

        async function saveTab(id) {
            await fetch('/api/admin/tabs', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id,
                    name: document.getElementById(`tName_${id}`).value,
                    title: '',
                    is_enabled: document.getElementById(`tEn_${id}`).value
                })
            });
            loadData();
            showToast('Вкладка обновлена!');
        }

        async function createPromo() {
            await fetch('/api/admin/promocodes', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    code: document.getElementById('pCode').value,
                    days: document.getElementById('pDays').value,
                    uses: document.getElementById('pUses').value
                })
            });
            loadData();
            showToast('Промокод создан!');
        }

        async function deletePromo(id) {
            await fetch(`/api/admin/promocodes/${id}`, { method: 'DELETE' });
            loadData();
            showToast('Промокод удален');
        }

        async function tgSendCode() {
            const res = await fetch('/api/admin/auth/send-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: document.getElementById('tgPhone').value })
            }).then(r => r.json());
            if (res.success) {
                pendingSessionId = res.sessionId;
                document.getElementById('tgStep1').classList.add('hidden');
                document.getElementById('tgStep2').classList.remove('hidden');
            }
            showToast(res.message, res.success ? 'success' : 'error');
        }

        async function tgVerifyCode() {
            const res = await fetch('/api/admin/auth/verify-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sessionId: pendingSessionId,
                    code: document.getElementById('tgCode').value,
                    password: document.getElementById('tgPassword').value
                })
            }).then(r => r.json());
            showToast(res.message, res.success ? 'success' : 'error');
            if (res.success) setTimeout(() => loadData(), 1500);
        }

        async function toggleAcc(id) {
            await fetch(`/api/admin/accounts/toggle/${id}`, { method: 'POST' });
            loadData();
            showToast('Статус аккаунта изменен');
        }

        async function deleteAcc(id) {
            await fetch(`/api/admin/accounts/${id}`, { method: 'DELETE' });
            loadData();
            showToast('Аккаунт удален');
        }

        async function addFaq() {
            await fetch('/api/admin/faq', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    question: document.getElementById('faqQ').value,
                    answer: document.getElementById('faqA').value
                })
            });
            loadData();
            showToast('Вопрос добавлен в FAQ!');
        }

        async function deleteFaq(id) {
            await fetch(`/api/admin/faq/${id}`, { method: 'DELETE' });
            loadData();
            showToast('Вопрос удален');
        }

        async function addBot() {
            await fetch('/api/admin/bots', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: document.getElementById('botTitle').value,
                    category: document.getElementById('botCategory').value,
                    description: document.getElementById('botDesc').value,
                    link: document.getElementById('botLink').value
                })
            });
            loadData();
            showToast('Бот добавлен!');
        }

        async function deleteBot(id) {
            await fetch(`/api/admin/bots/${id}`, { method: 'DELETE' });
            loadData();
            showToast('Бот удален');
        }

        async function addScammer() {
            await fetch('/api/admin/scammers', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('scamUser').value,
                    reason: document.getElementById('scamReason').value,
                    proof: document.getElementById('scamProof').value
                })
            });
            loadData();
            showToast('Скамер добавлен!');
        }

        async function deleteScammer(id) {
            await fetch(`/api/admin/scammers/${id}`, { method: 'DELETE' });
            loadData();
            showToast('Скамер удален');
        }

        loadData();
    </script>
</body>
</html>
