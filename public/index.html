<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1xly Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="app" class="max-w-6xl mx-auto p-6">
        <!-- Верхнее меню динамических вкладок -->
        <nav id="nav-tabs" class="flex flex-wrap gap-3 mb-8 border-b border-slate-800 pb-4">
            <!-- Динамически заполнится из БД -->
        </nav>

        <!-- Контент страниц -->
        <main id="main-content">
            <!-- Динамический контент -->
        </main>
    </div>

    <script>
        let appData = {};
        let currentUserId = localStorage.getItem('p1xly_user_id') || 'user_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('p1xly_user_id', currentUserId);

        async function loadData() {
            const res = await fetch('/api/data');
            appData = await res.json();
            renderNav();
            renderActiveTab();
        }

        let activeTab = 'catalog';

        function renderNav() {
            const nav = document.getElementById('nav-tabs');
            nav.innerHTML = '';
            
            if (appData.tabs) {
                appData.tabs.forEach(tab => {
                    if (!tab.is_enabled && !localStorage.getItem('isAdmin')) return;
                    const btn = document.createElement('button3' || 'button');
                    btn.className = `px-4 py-2 rounded-xl font-medium transition ${activeTab === tab.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'}`;
                    btn.innerText = tab.name;
                    btn.onclick = () => { activeTab = tab.id; renderActiveTab(); };
                    nav.appendChild(btn);
                });
            }

            // Кнопка админки
            const adminBtn = document.createElement('button');
            adminBtn.className = `px-4 py-2 rounded-xl font-medium transition bg-slate-900 text-red-400 border border-red-900/50 hover:bg-red-950/30 ml-auto`;
            adminBtn.innerText = '⚙️ Админка';
            adminBtn.onclick = () => { activeTab = 'admin'; renderActiveTab(); };
            nav.appendChild(adminBtn);
        }

        async function renderActiveTab() {
            renderNav();
            const main = document.getElementById('main-content');
            
            if (activeTab === 'catalog') {
                main.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">${appData.settings?.launcher_title || 'Каталог'}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${(appData.bots || []).map(b => `
                            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                                <span class="text-xs px-2.5 py-1 bg-indigo-500/10 text-indigo-400 rounded-lg">${b.category}</span>
                                <h3 class="text-lg font-bold mt-3">${b.title}</h3>
                                <p class="text-sm text-slate-400 mt-1">${b.description}</p>
                                <a href="${b.link}" target="_blank" class="mt-4 block text-center bg-indigo-600 hover:bg-indigo-500 py-2 rounded-xl font-medium transition">Открыть</a>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (activeTab === 'sender') {
                const subCheck = await fetch('/api/check-sub', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: currentUserId })
                }).then(r => r.json());

                if (!subCheck.active) {
                    main.innerHTML = `
                        <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center">
                            <h2 class="text-2xl font-bold text-red-400">Требуется подписка</h2>
                            <p class="text-slate-400 mt-2">Для использования мульти-аккаунт отправки активируйте подписку во вкладке «Подписка».</p>
                        </div>
                    `;
                    return;
                }

                main.innerHTML = `
                    <div class="max-w-xl mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl">
                        <h2 class="text-xl font-bold mb-6">Мульти-аккаунт отправка</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="text-sm text-slate-400">Аккаунт:</label>
                                <select id="accId" class="w-full mt-1 bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    ${(subCheck.accounts || []).map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="text-sm text-slate-400">Получатель (@username):</label>
                                <input type="text" id="recipient" class="w-full mt-1 bg-slate-950 border border-slate-800 p-3 rounded-xl" placeholder="@username">
                            </div>
                            <div>
                                <label class="text-sm text-slate-400">Текст:</label>
                                <textarea id="msgText" class="w-full mt-1 bg-slate-950 border border-slate-800 p-3 rounded-xl" placeholder="Текст сообщения..."></textarea>
                            </div>
                            <button onclick="sendMessage()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold transition">Отправить</button>
                            <p id="sendResult" class="text-sm text-center mt-2"></p>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'scammers') {
                main.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">🚨 База Скамеров</h2>
                    <div class="space-y-3">
                        ${(appData.scammers || []).map(s => `
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                <div>
                                    <span class="font-bold text-red-400">${s.username}</span>
                                    <p class="text-sm text-slate-400">${s.reason}</p>
                                </div>
                                <a href="${s.proof}" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl">Пруфы</a>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (activeTab === 'owner') {
                main.innerHTML = `
                    <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center">
                        <h2 class="text-xl font-bold mb-4">О владельце</h2>
                        <p class="text-slate-300">${appData.settings?.bio || 'Информация не указана'}</p>
                    </div>
                `;
            } else if (activeTab === 'sub') {
                main.innerHTML = `
                    <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl">
                        <h2 class="text-xl font-bold mb-4">Активация подписки</h2>
                        <input type="text" id="promoCode" placeholder="Введите промокод" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl mb-4">
                        <button onclick="activatePromo()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition">Активировать</button>
                        <p id="promoRes" class="text-sm text-center mt-3"></p>
                    </div>
                `;
            } else if (activeTab === 'admin') {
                const isAdmin = await fetch('/api/check-auth').then(r => r.json());
                if (!isAdmin.isAdmin) {
                    main.innerHTML = `
                        <div class="max-w-sm mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center">
                            <h2 class="text-xl font-bold mb-4">Вход в админку</h2>
                            <input type="password" id="adminPass" placeholder="Пароль" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl mb-4">
                            <button onclick="loginAdmin()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition">Войти</button>
                        </div>
                    `;
                } else {
                    main.innerHTML = `
                        <div class="space-y-8">
                            <div class="flex justify-between items-center">
                                <h2 class="text-2xl font-bold">Панель управления</h2>
                                <button onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-xl text-sm">Выйти</button>
                            </div>
                            
                            <!-- Добавление аккаунта MTProto -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h3 class="text-lg font-bold mb-4">🤖 Авторизация Telegram аккаунта</h3>
                                <div id="tgStep1" class="space-y-3">
                                    <input type="text" id="tgPhone" placeholder="+998..." class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <button onclick="tgSendCode()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl">Запросить код</button>
                                </div>
                                <div id="tgStep2" class="space-y-3 hidden mt-4">
                                    <input type="text" id="tgCode" placeholder="Код из Телеграма" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <input type="password" id="tgPassword" placeholder="Облачный пароль 2FA (если есть)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <button onclick="tgVerifyCode()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl">Подтвердить и добавить</button>
                                </div>
                                <p id="tgRes" class="text-sm mt-3"></p>
                            </div>

                            <!-- Управление ботами -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h3 class="text-lg font-bold mb-4">Добавить бота в каталог</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <input type="text" id="botTitle" placeholder="Название" class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <input type="text" id="botCategory" placeholder="Категория" class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <input type="text" id="botDesc" placeholder="Описание" class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                    <input type="text" id="botLink" placeholder="Ссылка (https://t.me/...)" class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                </div>
                                <button onclick="addBot()" class="mt-4 bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-xl">Добавить бота</button>
                            </div>

                            <!-- Логи -->
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
                                <h3 class="text-lg font-bold mb-4">📜 Логи активности</h3>
                                <div class="space-y-2 max-h-60 overflow-y-auto">
                                    ${(appData.logs || []).map(l => `
                                        <div class="text-xs bg-slate-950 p-3 rounded-xl border border-slate-800/50 flex justify-between">
                                            <span><b>${l.user_id}</b>: ${l.action} (${l.ip})</span>
                                            <span class="text-slate-500">${new Date(l.timestamp).toLocaleTimeString()}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        async function sendMessage() {
            const res = await fetch('/api/tg/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    userId: currentUserId,
                    accountId: document.getElementById('accId').value,
                    recipient: document.getElementById('recipient').value,
                    message: document.getElementById('msgText').value
                })
            }).then(r => r.json());
            document.getElementById('sendResult').innerText = res.message;
            document.getElementById('sendResult').className = `text-sm text-center mt-2 ${res.success ? 'text-emerald-400' : 'text-red-400'}`;
        }

        async function activatePromo() {
            const res = await fetch('/api/activate-promo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: currentUserId, code: document.getElementById('promoCode').value })
            }).then(r => r.json());
            document.getElementById('promoRes').innerText = res.message;
            document.getElementById('promoRes').className = `text-sm text-center mt-3 ${res.success ? 'text-emerald-400' : 'text-red-400'}`;
        }

        async function loginAdmin() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password: document.getElementById('adminPass').value })
            }).then(r => r.json());
            if (res.success) loadData();
            else alert('Неверный пароль');
        }

        async function logoutAdmin() {
            await fetch('/api/post', { method: 'POST' }); // или стандартный логаут
            await fetch('/api/logout', { method: 'POST' });
            loadData();
        }

        let pendingSessionId = '';
        async function tgSendCode() {
            const res = await fetch('/api/admin/auth/send-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: document.getElementById('tgPhone').value })
            }).then(r => r.json());
            if (res.success) {
                pendingSessionId = res.sessionId;
                document.getElementById('tgStep1').classList.add('hidden');
                document.getElementById('tgStep2').classList.remove('hidden');
            }
            document.getElementById('tgRes').innerText = res.message;
        }

        async function tgVerifyCode() {
            const res = await fetch('/api/admin/auth/verify-code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sessionId: pendingSessionId,
                    code: document.getElementById('tgCode').value,
                    password: document.getElementById('tgPassword').value
                })
            }).then(r => r.json());
            document.getElementById('tgRes').innerText = res.message;
            if (res.success) setTimeout(() => loadData(), 1500);
        }

        async function addBot() {
            await fetch('/api/admin/bots', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: document.getElementById('botTitle').value,
                    category: document.getElementById('botCategory').value,
                    description: document.getElementById('botDesc').value,
                    link: document.getElementById('botLink').value
                })
            });
            loadData();
        }

        loadData();
    </script>
</body>
</html>
