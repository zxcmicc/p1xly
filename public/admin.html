<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>p1xly // admin panel</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; padding: 40px; }
        .box { background: #11151c; border: 1px solid #1f242d; padding: 25px; border-radius: 12px; width: 100%; max-width: 650px; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #21293d; background: #161b22; color: #fff; box-sizing: border-box; }
        button { background: #2563eb; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #21293d; }
        .del-btn { background: #ef4444; width: auto; padding: 5px 10px; margin: 0; }
        h3 { margin-top: 25px; border-bottom: 1px solid #21293d; padding-bottom: 6px; color: #60a5fa; }
    </style>
</head>
<body>
<div class="box">
    <h2>⚡ Админ-панель P1xly</h2>
    
    <div id="login-form">
        <input type="password" id="password" placeholder="Пароль администратора">
        <button onclick="login()">Войти</button>
    </div>

    <div id="admin-panel" style="display:none;">

        <!-- Подключение аккаунтов по номеру -->
        <h3>📱 Добавить MTProto Аккаунт</h3>
        <div id="auth-step-1">
            <input type="text" id="phone-input" placeholder="Номер телефона (+998...)">
            <button onclick="sendPhoneCode()">Запросить код</button>
        </div>
        
        <div id="auth-step-2" style="display:none;">
            <input type="text" id="code-input" placeholder="Код из Telegram">
            <input type="password" id="password-2fa" placeholder="Пароль 2FA (если есть)">
            <button onclick="verifyPhoneCode()">Подтвердить и войти</button>
        </div>
        <p id="auth-status" style="font-size: 13px; margin-top: 5px;"></p>

        <h3>📋 Активные аккаунты в системе</h3>
        <div id="admin-accounts"></div>

        <h3>🤖 Каталог Ботов</h3>
        <input type="text" id="bot-title" placeholder="Название бота">
        <input type="text" id="bot-cat" placeholder="Категория">
        <input type="text" id="bot-desc" placeholder="Описание">
        <input type="text" id="bot-link" placeholder="Ссылка">
        <button onclick="addBot()">Добавить бота</button>
        <div id="admin-bots"></div>

    </div>
</div>

<script>
    let currentSessionId = null;

    function login() {
        fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ password: document.getElementById('password').value })
        }).then(res => res.json()).then(data => {
            if(data.success) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadAdminData();
            } else alert('Неверный пароль');
        });
    }

    function loadAdminData() {
        fetch('/api/data').then(res => res.json()).then(data => {
            // Список аккаунтов
            const accContainer = document.getElementById('admin-accounts');
            accContainer.innerHTML = '';
            (data.accounts || []).forEach(acc => {
                accContainer.innerHTML += `
                    <div class="item-row">
                        <span><b>${acc.name}</b></span>
                        <button class="del-btn" onclick="deleteAccount(${acc.id})">Удалить</button>
                    </div>`;
            });

            // Боты
            const bContainer = document.getElementById('admin-bots');
            bContainer.innerHTML = '';
            (data.bots || []).forEach(b => {
                bContainer.innerHTML += `
                    <div class="item-row">
                        <span><b>[${b.category}]</b> ${b.title}</span>
                        <button class="del-btn" onclick="deleteBot(${b.id})">Удалить</button>
                    </div>`;
            });
        });
    }

    async function sendPhoneCode() {
        let phone = document.getElementById('phone-input').value.trim();
        let status = document.getElementById('auth-status');
        status.innerText = 'Отправка запроса в Telegram...';

        let res = await fetch('/api/admin/auth/send-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone })
        });
        let data = await res.json();

        if (data.success) {
            currentSessionId = data.sessionId;
            document.getElementById('auth-step-1').style.display = 'none';
            document.getElementById('auth-step-2').style.display = 'block';
            status.style.color = '#238636';
            status.innerText = data.message;
        } else {
            status.style.color = '#ef4444';
            status.innerText = data.message;
        }
    }

    async function verifyPhoneCode() {
        let code = document.getElementById('code-input').value.trim();
        let password = document.getElementById('password-2fa').value.trim();
        let status = document.getElementById('auth-status');
        status.innerText = 'Авторизация...';

        let res = await fetch('/api/admin/auth/verify-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ sessionId: currentSessionId, code, password })
        });
        let data = await res.json();

        if (data.success) {
            status.style.color = '#238636';
            status.innerText = data.message;
            document.getElementById('auth-step-1').style.display = 'block';
            document.getElementById('auth-step-2').style.display = 'none';
            document.getElementById('phone-input').value = '';
            document.getElementById('code-input').value = '';
            document.getElementById('password-2fa').value = '';
            loadAdminData();
        } else {
            status.style.color = '#ef4444';
            status.innerText = data.message;
        }
    }

    function deleteAccount(id) {
        fetch('/api/admin/accounts/' + id, { method: 'DELETE' }).then(() => loadAdminData());
    }

    function addBot() {
        fetch('/api/admin/bots', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title: document.getElementById('bot-title').value,
                category: document.getElementById('bot-cat').value,
                description: document.getElementById('bot-desc').value,
                link: document.getElementById('bot-link').value
            })
        }).then(() => loadAdminData());
    }

    function deleteBot(id) {
        fetch('/api/admin/bots/' + id, { method: 'DELETE' }).then(() => loadAdminData());
    }
</script>
</body>
</html>
